name: Supabase keep-alive

# Free Supabase projects are paused after a week without API traffic. Read one row twice a week so that never happens.
# The anon key is the public client key (row level security limits it to the heartbeat row), so no secret is needed.
on:
  schedule:
    - cron: "0 6 * * 1,4"
  workflow_dispatch:

env:
  SUPABASE_URL: https://nptmkkjgaewaijunieyf.supabase.co
  SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5wdG1ra2pnYWV3YWlqdW5pZXlmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTMyMDE4MDQsImV4cCI6MjEwODc3NzgwNH0.LOOwa0Ufx4GxoZCoxkKTLbpYfEiUPL1jO9M87AdqyVg

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Read the heartbeat row
        run: |
          curl --fail --silent --show-error             "$SUPABASE_URL/rest/v1/heartbeat?select=id,pinged_at"             -H "apikey: $SUPABASE_ANON_KEY" -H "Authorization: Bearer $SUPABASE_ANON_KEY"
