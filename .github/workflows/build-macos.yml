name: Build macOS app

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build SecureVault.app
        run: |
          chmod +x build.sh
          ./build.sh

      - name: Zip app bundle
        run: ditto -c -k --sequesterRsrc dist/SecureVault.app SecureVault-macOS.zip

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: SecureVault-macOS
          path: SecureVault-macOS.zip
